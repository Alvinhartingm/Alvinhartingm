<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM SaaS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
  <h1 class="mt-4">Dashboard CRM</h1>
  <div id="lead-table" class="mt-5"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
fetch('../backend/public/index.php/leads?tenant_id=1')
  .then(r=>r.json())
  .then(data=>{
    let html = '<table class="table table-striped"><thead><tr><th>Nombre</th><th>Email</th></tr></thead><tbody>';
    data.forEach(l=>{html+=`<tr><td>${l.name}</td><td>${l.email}</td></tr>`});
    html+='</tbody></table>';
    document.getElementById('lead-table').innerHTML = html;
  });
</script>
</body>
</html>
